version: '3.3'

services:
  postgres:
    image: postgres
    container_name: my_postgres
    networks:
      my_network:
        ipv4_address: 172.18.0.2


  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    networks:
      my_network:
        ipv4_address: 172.18.0.3
    environment:
      - POSTGRES_DATABASE_HOST=172.18.0.2
      - POSTGRES_DATABASE_PORT=5432
      - REACT_FRONTEND_IP=172.18.0.4
      - REACT_FRONTEND_PORT=80

  frontend:
    build:
      context: .
      dockerfile: src/Dockerfile
    depends_on:
      - api
    ports:
      - "80:80"
    networks:
      my_network:
        ipv4_address: 172.18.0.4
    environment:
      - REACT_APP_BACKEND_IP=172.0.0.3
      - REACT_APP_BACKEND_PORT=8000

# docker network
networks:
  my_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.18.0.0/16